name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    services:
      postgres:
        # The privacy and accept-pipeline tests need a real database, not a fake.
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: health_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run ruff check src tests
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/health_test
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Deploy
        env:
          SHA: ${{ github.sha }}
        run: |
          scp -o StrictHostKeyChecking=accept-new docker-compose.yml manifest.json \
            deploy@home-apps:/opt/home/apps/health/
          ssh -o StrictHostKeyChecking=accept-new deploy@home-apps \
            "/opt/home/bin/deploy.sh health $SHA"
