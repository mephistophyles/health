[project]
name = "health-api"
version = "0.1.0"
description = "Household weekly meal and training planner"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  # ZoneInfo needs a tz database; the slim base image cannot be relied on to carry one.
  "tzdata>=2024.2",
  "uvicorn[standard]>=0.32,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"] # FastAPI dependencies intentionally use Depends defaults.
